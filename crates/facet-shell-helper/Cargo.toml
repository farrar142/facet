[package]
name = "facet-shell-helper"
description = "facet 셸 확장 도우미 실행 파일: 셸 확장을 UI 프로세스 대신 싣는다(ADR-0006)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "facet-shell-helper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
facet-shell-protocol.workspace = true
# 파이프 연결(겹친 입출력)과 뒤 티켓의 셸 호출(`unsafe`)은 안전 래퍼 크레이트에 둔다(ADR-0002).
facet-win.workspace = true

[dev-dependencies]
facet-core.workspace = true
facet-shell-protocol.workspace = true
tempfile = "3.27.0"
