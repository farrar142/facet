[package]
name = "facet-core"
description = "facet의 화면에 의존하지 않는 코어"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# 인덱서 서비스 연결 테스트(`tests/indexer_client.rs`)만 같은 프로세스에 합성 인덱스의 파이프 서버를 띄우려고 쓴다.
facet-index.workspace = true
facet-indexer = { path = "../facet-indexer" }

[dependencies]
# 폴더 변경 감시의 Windows 호출(`unsafe`)은 안전 래퍼 크레이트에 둔다(ADR-0002).
facet-win.workspace = true
# 질의 문법 해석(`query_syntax.rs`)의 결과가 질의 프로토콜의 조건 트리다.
facet-protocol.workspace = true
# 셸 확장 도우미 관리(`shell_helper.rs`)가 도우미 프로토콜의 메시지를 쓴다.
facet-shell-protocol.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 세션 파일(사람이 읽을 수 있는 JSON, `session.rs`).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1"
# 규칙 묶음 파일(사람이 읽을 수 있는 TOML, `rename_presets.rs`).
toml = "1"
# 설정 파일(`settings.rs`)을 주석·순서·모르는 키를 보존하며 고쳐 쓴다.
toml_edit = "0.25"
encoding_rs = "0.8"
# zip 항목의 Deflate 풀기(`zip_archive.rs`, #425). 이미 png가 쓰는 크레이트다.
miniz_oxide = "0.9"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "bmp"] }
