[package]
name = "facet-core"
description = "facet의 화면에 의존하지 않는 코어"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
# 폴더 변경 감시의 Windows 호출(`unsafe`)은 안전 래퍼 크레이트에 둔다(ADR-0002).
facet-win.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
