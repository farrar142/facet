[package]
name = "facet-indexer"
description = "facet 인덱서 서비스 실행 파일: 볼륨 핸들, MFT 읽기(지금은 개발용 MFT 떠 내기 명령)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "facet_indexer"
path = "src/lib.rs"

[[bin]]
name = "facet-indexer"
path = "src/main.rs"

# 작업 공간 lint와 같되 unsafe_code만 뺐다. 볼륨 핸들·DeviceIoControl 같은 Windows API는 `unsafe`가
# 필요하고, spec(#22)이 `unsafe`와 Windows API를 이 크레이트에만 가두기로 했다. 작업 공간에서
# `unsafe_code` 금지를 끈 크레이트는 이것 하나다(facet-app은 forbid 대신 deny로 여전히 막는다).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
