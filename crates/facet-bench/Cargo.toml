[package]
name = "facet-bench"
description = "facet 측정 도구: 시험 폴더 생성과 코어 벤치마크"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "facet-bench"
path = "src/main.rs"

[dependencies]
facet-core.workspace = true
facet-index.workspace = true
# 권한 거르기를 거친 질의 벤치마크(인덱서 서비스의 `Volumes::search_as`).
facet-indexer = { path = "../facet-indexer" }
facet-protocol.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
