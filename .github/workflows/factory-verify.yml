# Factory task: Verify (spec #249 "Verify", docs/adr/0001-software-factory.md)
#
# The Implementer opens a PR and dispatches this run; it never merges. Verify, a different run on
# a different model, decides:
#   1. machine checks (.github/factory/verify.sh mech): the ticket's `#[ignore = "#N"]` lines are
#      all gone and the acceptance tests (crates/*/tests/spec_*.rs) are otherwise untouched;
#   2. the branch on today's main passes `cargo xtask ci` (skipped when the PR head is the commit
#      the Implementer checked, `<!-- factory-checked <sha> -->`, and already sits on main);
#   3. an acceptance review on Sonnet (.github/factory/verify.md): every acceptance criterion met,
#      nothing out of scope.
# Pass: squash-merge, close the ticket, build main, dispatch the next ticket (verify.sh pass).
# Otherwise: send the ticket back to the Implementer with the reason, or to a human on the second
# send-back (verify.sh sendback).
name: factory-verify
run-name: 'verify #${{ inputs.issue }} (PR #${{ inputs.pr }})'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket number
        required: true
        type: number
      pr:
        description: The Implementer's PR for the ticket
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  # dispatch-next.sh (after a merge or a hand-over to a human) and ledger.sh read these.
  FACTORY_SPEC_QUEUE: ${{ vars.FACTORY_SPEC_QUEUE }}
  FACTORY_SPEC_BUDGET_USD: ${{ vars.FACTORY_SPEC_BUDGET_USD }}
  FACTORY_DAILY_BUDGET_USD: ${{ vars.FACTORY_DAILY_BUDGET_USD }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    # The same group as the Implementer: implementing and verifying run in one line, so the next
    # ticket starts only after this verdict (and is checked against the main this run merged into).
    concurrency:
      group: factory-implementer
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      N: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Same build settings as the Implementer, so rust-cache artifacts are shared.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Budget guard
        id: budget
        run: bash .github/factory/ledger.sh guard "$N"

      - name: Check out the PR
        id: pr
        if: steps.budget.outputs.go == 'true'
        run: |
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "::notice::PR #$PR is $state; nothing to verify"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)
          checked=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body | tr -d '\r' \
            | sed -n 's/.*<!-- factory-checked \([0-9a-f]*\) -->.*/\1/p' | tail -n 1)
          git config user.name "facet-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "+refs/heads/$branch:refs/remotes/origin/$branch"
          git switch -C "$branch" "origin/$branch"
          mkdir -p .factory
          echo ".factory/" >> .git/info/exclude
          echo "*.log" >> .git/info/exclude
          echo "::notice::PR #$PR, branch $branch at $(git rev-parse HEAD), checked ${checked:-(none)}"
          {
            echo "go=true"
            echo "branch=$branch"
            echo "checked=$checked"
          } >> "$GITHUB_OUTPUT"

      - name: Machine checks
        id: mech
        if: steps.pr.outputs.go == 'true'
        run: |
          if bash .github/factory/verify.sh mech "$N" origin/main > .factory/mech.md; then r=pass; else r=fail; fi
          cat .factory/mech.md
          echo "mech=$r" >> "$GITHUB_OUTPUT"

      # `cargo xtask ci` already passed on the checked commit; run it again only when the head
      # moved or main moved on. A rebase conflict sends the ticket back.
      - name: Rebase onto main
        id: base
        if: steps.mech.outputs.mech == 'pass'
        env:
          CHECKED: ${{ steps.pr.outputs.checked }}
        run: |
          head=$(git rev-parse HEAD)
          if git merge-base --is-ancestor origin/main HEAD && [ -n "$CHECKED" ] && [ "$head" = "$CHECKED" ]; then
            echo "::notice::the head is the checked commit on today's main; not running cargo xtask ci again"
            echo "ci=skip" >> "$GITHUB_OUTPUT"
          elif git rebase origin/main; then
            echo "ci=run" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git rebase --abort
            printf '### main 위로 rebase하면 충돌한다\n\n%s\n' "$files" > .factory/conflict.md
            cat .factory/conflict.md
            echo "ci=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.base.outputs.ci == 'run'

      - name: Automated checks
        id: ci
        if: steps.base.outputs.ci == 'run'
        run: |
          set -o pipefail
          cargo xtask ci 2>&1 | tee .factory/ci.log

      # The merge must land exactly what was checked.
      - name: Push the rebased branch
        id: push
        if: steps.ci.outcome == 'success'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: git push --force-with-lease="$BRANCH" origin "$BRANCH"

      - name: Install Claude Code
        id: claude
        if: >-
          steps.mech.outputs.mech == 'pass' &&
          (steps.base.outputs.ci == 'skip' || steps.ci.outcome == 'success')
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
          if (-not (Test-Path $exe)) { throw "claude.exe not found at $exe" }
          & $exe --version
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Acceptance review
        if: steps.claude.outcome == 'success'
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Verify run of this repo's software factory.
            Ticket: #${{ inputs.issue }} in ${{ github.repository }}, PR #${{ inputs.pr }} (checked out as HEAD).
            Read .github/factory/verify.md and follow it exactly.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash(gh:*),Bash(git diff:*),Bash(git log:*),Read,Write,Glob,Grep"

      - name: Record cost (verify)
        if: always() && steps.budget.outputs.go == 'true'
        run: bash .github/factory/ledger.sh record verify "$N"

      - name: Merge or send back
        if: always() && steps.pr.outputs.go == 'true'
        env:
          CANCELLED: ${{ cancelled() }}
          MECH: ${{ steps.mech.outputs.mech }}
          BASE: ${{ steps.base.outputs.ci }}
          CI_OUTCOME: ${{ steps.ci.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          if [ "$CANCELLED" = true ]; then
            echo "::warning::cancelled; PR #$PR stays open and #$N in progress"
            exit 0
          fi
          reason=.factory/sendback.md
          verdict=$(tr -d '[:space:]' < .factory/verify-verdict 2>/dev/null || true)
          if [ "$MECH" != pass ]; then
            { echo "### 기계 검사 실패"; echo; cat .factory/mech.md 2>/dev/null; } > "$reason"
          elif [ "$BASE" = conflict ]; then
            cp .factory/conflict.md "$reason"
          elif [ "$BASE" = run ] && [ "$CI_OUTCOME" != success ]; then
            {
              echo "### main 위로 rebase한 뒤 \`cargo xtask ci\` 실패"
              echo
              echo '```'
              grep -E 'error|FAILED|panicked|xtask ci:' .factory/ci.log 2>/dev/null | tail -n 60
              echo '```'
            } > "$reason"
          elif [ "$BASE" = run ] && [ "$PUSH_OUTCOME" != success ]; then
            echo "### main 위로 rebase한 브랜치를 push하지 못했다(그 사이 브랜치가 바뀌었을 수 있다)" > "$reason"
          elif [ "$verdict" != pass ]; then
            {
              if [ "$verdict" = fail ]; then echo "### 인수 판단: 실패"; else echo "### 인수 판단이 결론을 남기지 않았다"; fi
              echo
              cat .factory/verify-report.md 2>/dev/null
            } > "$reason"
          elif bash .github/factory/verify.sh pass "$N" "$PR" .factory/verify-report.md; then
            exit 0
          else
            { echo "### 판단은 통과였지만 PR을 병합하지 못했다"; echo; cat .factory/verify-report.md 2>/dev/null; } > "$reason"
          fi
          cat "$reason"
          bash .github/factory/verify.sh sendback "$N" "$PR" "$reason"

      # Nothing to verify (the PR is no longer open) or the guard stopped the run: keep the chain
      # going unless the daily budget is spent (the Implementer's schedule resumes after KST
      # midnight). A ticket stopped here keeps `in-progress` and its open PR; dispatch this
      # workflow again for it once its spec may run.
      - name: Dispatch next ticket
        if: always() && steps.pr.outputs.go != 'true' && steps.budget.outputs.reason != 'daily'
        run: bash .github/factory/dispatch-next.sh
