# Factory task: Decompose (docs/adr/0001-software-factory.md)
# Splits a spec issue into tracer-bullet tickets with native blocked-by edges.
# Trigger: the `spec` label, or a manual run with the spec issue number.
name: factory-decompose

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Spec issue number to decompose
        required: true
        type: number

concurrency:
  group: factory-decompose-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write
  id-token: write

jobs:
  decompose:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'spec'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPEC: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Stop before spending a run if this spec was already decomposed.
      - name: Skip if the spec already has sub-issues
        id: guard
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues/$SPEC" --jq '.sub_issues_summary.total // 0')
          echo "sub_issues=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then echo "::notice::#$SPEC already has $n sub-issues; skipping."; fi

      - name: Decompose
        if: steps.guard.outputs.sub_issues == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the Decompose run of this repo's software factory.
            Spec issue: #${{ env.SPEC }} in ${{ github.repository }}.
            Read .github/factory/decompose.md and follow it exactly.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(gh:*),Read,Glob,Grep"

      # The owner approves tickets without review (decision 2026-11-15): label every new
      # ticket `ready-for-agent` and start the serial Implementer chain. GITHUB_TOKEN label
      # changes fire no events, so dispatch the first unblocked ticket explicitly.
      - name: Approve tickets and start the chain
        if: steps.guard.outputs.sub_issues == '0'
        env:
          REPO: ${{ github.repository }}
        run: |
          subs=$(gh api "repos/$REPO/issues/$SPEC/sub_issues" --paginate --jq '.[] | select(.state == "open") | .number' | sort -n)
          if [ -z "$subs" ]; then echo "::error::Decompose created no tickets for #$SPEC"; exit 1; fi
          for n in $subs; do gh issue edit "$n" --repo "$REPO" --add-label ready-for-agent; done
          sleep 5
          for n in $(gh issue list --repo "$REPO" --state open --label ready-for-agent --limit 200 --json number --jq 'sort_by(.number) | .[].number'); do
            open=$(gh api "repos/$REPO/issues/$n" --jq '.issue_dependencies_summary.blocked_by // 0')
            if [ "$open" -eq 0 ]; then
              echo "dispatch #$n"
              gh workflow run factory-implementer.yml --repo "$REPO" -f issue="$n"
              exit 0
            fi
          done
          echo "::warning::no ticket of #$SPEC is unblocked"
