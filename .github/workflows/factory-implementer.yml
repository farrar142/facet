# Factory task: Implementer (docs/adr/0001-software-factory.md)
#
# A human approves a ticket by labelling it `ready-for-agent`. A run starts only
# when every blocker of the ticket is closed; otherwise the label stays and the
# `frontier` job dispatches the ticket once its last blocker closes.
#
# The agent edits and commits (lifting only its own ticket's acceptance-test ignores). The
# workflow itself runs `cargo xtask ci`, pushes and opens the PR, and hands it to
# factory-verify.yml (spec #249), which checks the PR and merges it or sends the ticket back.
# This workflow never merges.
name: factory-implementer

on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket number to implement
        required: true
        type: number
  # 00:05 KST: the daily budget (spec #249) starts over, so restart a chain that stopped on it.
  schedule:
    - cron: '5 15 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  # Spec issues in roadmap order, from the repository variable (spec #249). Empty: the factory
  # never moves on to another spec by itself (the trial runs only the spec labelled `spec`).
  FACTORY_SPEC_QUEUE: ${{ vars.FACTORY_SPEC_QUEUE }}
  # Budgets of .github/factory/ledger.sh (spec #249 "비용 장부와 상한"); empty means its defaults.
  FACTORY_SPEC_BUDGET_USD: ${{ vars.FACTORY_SPEC_BUDGET_USD }}
  FACTORY_DAILY_BUDGET_USD: ${{ vars.FACTORY_DAILY_BUDGET_USD }}

jobs:
  # A ticket closed (usually by a merged PR): dispatch every approved ticket
  # whose blockers are now all closed.
  frontier:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # Runs are serial (see the implement job), so dispatch only the first one
      # (that its budget guard lets start).
      - name: Dispatch the next unblocked approved ticket
        run: bash .github/factory/dispatch-next.sh --tickets-only

  # Daily after KST midnight: only "dispatch next ticket", unless a run is already going.
  resume:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch next ticket
        run: |
          busy=$(gh run list --repo "$REPO" --workflow factory-implementer.yml --limit 50 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }})] | length")
          if [ "$busy" -gt 0 ]; then
            echo "::notice::$busy factory-implementer run(s) going; the chain is alive"
            exit 0
          fi
          bash .github/factory/dispatch-next.sh

  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent')
    runs-on: windows-latest
    timeout-minutes: 180
    # One ticket at a time across the repo (decision 2026-11-15): parallel runs kept
    # editing the same files. A group keeps at most one pending run and cancels older
    # pending ones, so runs are chained instead: a run that opened a PR dispatches Verify
    # (same group, factory-verify.yml), which dispatches the next unblocked ticket; any other
    # run does that itself (the "Dispatch next ticket" step). A cancelled run leaves its
    # ticket labelled `ready-for-agent`, so the chain picks it up later.
    concurrency:
      group: factory-implementer
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      N: ${{ github.event.issue.number || inputs.issue }}
      BRANCH: agent/issue-${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # Line tables only (no full debug info) in dev/test builds: the workspace links about 60
      # test binaries, and full PDBs make each link slower. Backtraces keep file and line.
      # The agent's builds and the checks share this, so the checks reuse the agent's artifacts.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Spec #249 "비용 장부와 상한": before claiming, stop on needs-decision / factory-paused and
      # on the spec and daily budgets. A stopped ticket keeps `ready-for-agent`.
      - name: Budget guard
        id: budget
        run: bash .github/factory/ledger.sh guard "$N"

      - name: Guard and claim
        id: guard
        if: steps.budget.outputs.go == 'true'
        run: |
          read -r state labels < <(gh issue view "$N" --repo "$REPO" --json state,labels --jq '[.state, ([.labels[].name] | join(","))] | @tsv')
          go=true
          if [ "$state" != "OPEN" ]; then echo "::notice::#$N is not open"; go=false; fi
          case ",$labels," in *,ready-for-agent,*) ;; *) echo "::notice::#$N is not labelled ready-for-agent"; go=false;; esac
          if $go; then
            open=$(gh api "repos/$REPO/issues/$N" --jq '.issue_dependencies_summary.blocked_by // 0')
            if [ "$open" -gt 0 ]; then
              echo "::notice::#$N has $open open blocker(s); the frontier job will dispatch it later"
              go=false
            fi
          fi
          if $go; then
            gh issue edit "$N" --repo "$REPO" --remove-label ready-for-agent --add-label in-progress
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          # Model: the ticket's model label (set by Decompose), Sonnet when there is none,
          # and Opus for any retry after a code failure (the checks failed; an
          # infrastructure failure retries on the same model, see "Record failure") or after
          # Verify sent the ticket back (`<!-- factory-sendback -->`, spec #249).
          # Opus only for hard tickets (Windows API, OLE, concurrency safety); never Fable.
          model=claude-sonnet-5-5
          case ",$labels," in *,model:opus,*) model=claude-opus-5-5;; esac
          fails=$(gh issue view "$N" --repo "$REPO" --json comments --jq '[.comments[].body | select(contains("<!-- factory-implementer-failed -->") or contains("<!-- factory-sendback -->"))] | length')
          if [ "$fails" -gt 0 ]; then model=claude-opus-5-5; fi
          echo "::notice::#$N runs on $model (earlier code failures and send-backs: $fails)"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Prepare branch
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "facet-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p .factory
          echo ".factory/" >> .git/info/exclude
          # Logs the agent writes while checking (ci.log, run 43938463111) must not land in the PR.
          echo "*.log" >> .git/info/exclude

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.go == 'true'

      # The action's own installer is a shell script that refuses Windows, so install
      # the native Windows build and hand the action its path.
      - name: Install Claude Code
        id: claude
        if: steps.guard.outputs.go == 'true'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
          if (-not (Test-Path $exe)) { throw "claude.exe not found at $exe" }
          & $exe --version
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Implement
        if: steps.guard.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Runs dispatched by this workflow itself (frontier, next tickets) have the bot as actor.
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run of this repo's software factory.
            Ticket: #${{ env.N }} in ${{ github.repository }}. You are on branch ${{ env.BRANCH }}.
            Read .github/factory/implementer.md and follow it exactly.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      # The action's log hides the agent's commands (show_full_output would also print tool
      # output, which may carry secrets in a public repo). Print only the shell commands it ran,
      # so slow or backgrounded commands show up in the run log.
      - name: Agent commands
        if: always() && steps.guard.outputs.go == 'true'
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "no execution log"; exit 0; }
          jq -r '(if type == "array" then .[] else . end)
            | select(.type == "assistant") | .message.content[]?
            | select(.type == "tool_use" and .name == "Bash")
            | (if .input.run_in_background then "[background] " else "" end) + (.input.command | gsub("\n"; " ") | .[0:200])' "$f" || true

      # Cost ledger (spec #249). After "Agent commands", which reads the same execution file:
      # recording moves it away so a later stage does not count it again.
      - name: Record cost (implement)
        if: always() && steps.guard.outputs.go == 'true'
        run: bash .github/factory/ledger.sh record implementer "$N"

      # Put the agent's commits on top of today's main: sibling tickets or factory changes
      # may have landed during the run. Pushing a branch based on an older main also
      # counts as editing workflow files, which GITHUB_TOKEN may not do.
      # On a conflict, fall back to a merge and let the agent resolve it (the PR is squashed anyway).
      - name: Rebase onto main
        id: rebase
        if: steps.guard.outputs.go == 'true'
        run: |
          # The agent sometimes ends with staged or unstaged edits it never committed
          # (run 43823742621), which stops the rebase. If it committed work, add the
          # leftovers on top (the automated checks below still judge the result). If it
          # made no commits it may have stopped on purpose (implementer.md section 4),
          # so drop them and let "the agent made no commits" fail the run.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
              echo "::warning::the agent left uncommitted changes; committing them"
              git add -A
              git commit -q -m "에이전트가 커밋하지 않은 변경을 남긴다"
              # Line-ending conversion can leave the just-committed files "modified" again,
              # which stops the rebase ("You have unstaged changes", run 43938463111).
              git reset -q --hard
            else
              echo "::warning::the agent left uncommitted changes and made no commits; dropping them"
              git reset -q --hard
              git clean -fdq
            fi
          fi
          git fetch origin main
          if git rebase origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            git merge --no-edit origin/main || true
            echo "::warning::conflicts with main: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve conflicts
        if: steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run for ticket #${{ env.N }} in ${{ github.repository }}.
            You already implemented the ticket on branch ${{ env.BRANCH }}. Other tickets merged into
            main meanwhile, and merging origin/main left conflicts (see `git status`).
            Resolve every conflict so that both your ticket's behaviour and main's changes survive.
            Never drop main's changes to make yours fit. Then run `cargo xtask ci` until it passes,
            and finish with `git commit --no-edit`. Do not push.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (conflicts)
        if: always() && steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        run: bash .github/factory/ledger.sh record implementer-conflicts "$N"

      # No commits means nothing to check: fail here instead of after the 4-minute checks
      # (runs 43909075691, 43922416562). Counts as an infrastructure failure, as before.
      - name: Require commits
        if: steps.guard.outputs.go == 'true'
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "::error::the agent made no commits"; exit 1
          fi

      # Deterministic gate: the agent's word is not enough.
      # Processes the agent left running (xtask, the app, test binaries) lock their
      # executables, and cargo then cannot rebuild them ("failed to remove file
      # target/xtask/debug/xtask.exe: Access is denied", run 43831682346).
      # A first failure goes back to the agent in the same run with the log (below) instead of
      # throwing the whole run away; only the second check decides the run.
      - name: Automated checks (first)
        id: checks_first
        if: steps.guard.outputs.go == 'true'
        continue-on-error: true
        run: |
          for exe in xtask.exe facet.exe facet-bench.exe facet-indexer.exe facet-query.exe; do
            taskkill //F //T //IM "$exe" >/dev/null 2>&1 || true
          done
          cargo xtask ci 2>&1 | tee .factory/ci.log

      - name: Fix failed checks
        if: steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run for ticket #${{ env.N }} in ${{ github.repository }}, on branch ${{ env.BRANCH }}.
            You implemented the ticket and committed. The workflow then ran `cargo xtask ci`, and it failed.
            Its output is in .factory/ci.log (large: search it for "error", "FAILED", "panicked" and the
            "xtask ci:" stage lines instead of reading it whole). Follow .github/factory/implementer.md.
            Find the cause and fix it. If a test failed because of timing on the shared runner rather than
            your change, rerun just that test to confirm, and fix the test only if it is genuinely racy.
            Check your fix with the failing stage or test only (the workflow runs the whole
            `cargo xtask ci` again after you), commit, and do not push.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns 80
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (fix)
        if: always() && steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        run: bash .github/factory/ledger.sh record implementer-fix "$N"

      - name: Automated checks
        id: checks
        if: steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::the agent left uncommitted changes after fixing; committing them"
            git add -A
            git commit -q -m "에이전트가 커밋하지 않은 변경을 남긴다"
          fi
          for exe in xtask.exe facet.exe facet-bench.exe facet-indexer.exe facet-query.exe; do
            taskkill //F //T //IM "$exe" >/dev/null 2>&1 || true
          done
          cargo xtask ci

      # The PR body carries `Closes #N` and the commit `cargo xtask ci` passed on
      # (`<!-- factory-checked <sha> -->`): Verify skips its own `cargo xtask ci` when the PR head is
      # still that commit and sits on today's main.
      - name: Push and open PR
        id: pr
        if: steps.guard.outputs.go == 'true'
        run: |
          sha=$(git rev-parse HEAD)
          git push --force origin "$BRANCH"
          body=.factory/pr-body.md
          [ -s "$body" ] || echo "(the agent wrote no PR body)" > "$body"
          printf '\n\nCloses #%s\n\n_Opened by the factory Implementer run: %s_\n\n<!-- factory-checked %s -->\n' "$N" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$sha" >> "$body"
          title=$(gh issue view "$N" --repo "$REPO" --json title --jq .title)
          url=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$url" ]; then
            gh pr edit "$url" --body-file "$body"
          else
            url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$body")
          fi
          number=$(gh pr view "$url" --repo "$REPO" --json number --jq .number)
          echo "PR: $url"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The Implementer does not merge (spec #249): Verify checks the PR (machine checks, acceptance
      # review), then merges it and moves the chain on, or sends the ticket back. It shares the
      # concurrency group, so it runs right after this run and before any next ticket.
      - name: Hand over to Verify
        id: handover
        if: steps.guard.outputs.go == 'true'
        run: gh workflow run factory-verify.yml --repo "$REPO" -f issue="$N" -f pr="${{ steps.pr.outputs.number }}"

      # A code failure (the automated checks failed) counts toward the model rule: one puts the
      # ticket back in the queue and the retry runs on Opus, two leave it to the managing session
      # (`ready-for-human`, ADR-0001).
      # Any other failure (runner, network, installer, agent action crash) has nothing to do
      # with the code: retry on the same model (decision 2026-11-16), and hand the ticket
      # to the managing session only after three of them.
      - name: Record failure
        if: failure() && steps.guard.outputs.go == 'true'
        run: |
          if [ "${{ steps.checks.outcome }}" = failure ]; then
            marker='<!-- factory-implementer-failed -->'; limit=2; what="code"
          else
            marker='<!-- factory-implementer-infra-failed -->'; limit=3; what="infrastructure"
          fi
          gh issue comment "$N" --repo "$REPO" --body "$marker
          Implementer run failed ($what): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fails=$(gh issue view "$N" --repo "$REPO" --json comments --jq "[.comments[].body | select(contains(\"$marker\"))] | length")
          gh issue edit "$N" --repo "$REPO" --remove-label in-progress
          if [ "$fails" -ge "$limit" ]; then
            gh issue edit "$N" --repo "$REPO" --add-label ready-for-human
            gh issue comment "$N" --repo "$REPO" --body "Implementer failed $fails times ($what). The managing session takes this ticket out of the factory."
          else
            gh issue edit "$N" --repo "$REPO" --add-label ready-for-agent
          fi

      # Keep the chain going when this run did not hand a PR to Verify (failed, or skipped because
      # the ticket was blocked, not approved or stopped by its budget guard). After a hand-over,
      # Verify dispatches the next ticket. Lowest-numbered unblocked approved ticket first.
      - name: Dispatch next ticket
        if: always() && steps.handover.outcome != 'success'
        run: |
          sleep 10
          # A run stopped by the daily budget does not look for another ticket: none may start.
          if [ "${{ steps.budget.outputs.reason }}" = daily ]; then exit 0; fi
          bash .github/factory/dispatch-next.sh
