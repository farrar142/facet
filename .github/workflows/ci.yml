name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 공장 Implementer가 GITHUB_TOKEN으로 연 PR은 CI가 자동으로 돌지 않으므로
  # `gh workflow run ci.yml --ref <브랜치>`로 직접 띄운다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml의 툴체인과 컴포넌트를 설치한다.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask ci
