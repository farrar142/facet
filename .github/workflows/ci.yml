name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml의 툴체인과 컴포넌트를 설치한다.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo xtask ci
