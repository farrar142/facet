[package]
name = "xtask"
description = "facet 저장소 작업 명령(cargo xtask)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# MFT 조각을 만든 뒤 레코드를 확인하는 데 쓴다(`mft-fixture`).
facet-indexer = { path = "../crates/facet-indexer" }
sha2 = "0.11.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
