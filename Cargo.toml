[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/farrar142/facet"
publish = false

[workspace.dependencies]
facet-core = { path = "crates/facet-core" }
facet-index = { path = "crates/facet-index" }
facet-protocol = { path = "crates/facet-protocol" }
facet-win = { path = "crates/facet-win" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
